name: Vérifier et construire Mémoire
on: [push, pull_request, workflow_dispatch]
jobs:
  data-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Dépendance JSON de test
        run: |
          curl --fail --location https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o json.jar
          echo '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  json.jar' | sha256sum --check
      - run: python3 test_local.py --jdk "$JAVA_HOME" --json-jar json.jar
  apk:
    if: github.event_name == 'workflow_dispatch'
    needs: data-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python3 build_local.py --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: Memoire-APK
          path: Memoire-0.5.0.apk
